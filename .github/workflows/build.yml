name: Build Newclier v2
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y debootstrap xorriso syslinux isolinux

      - name: Build rootfs
        run: |
          sudo debootstrap noble /tmp/nr http://archive.ubuntu.com/ubuntu
          sudo mount --bind /dev /tmp/nr/dev
          sudo mount --bind /proc /tmp/nr/proc
          sudo mount --bind /sys /tmp/nr/sys
          sudo chroot /tmp/nr /bin/bash -c "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ubuntu-desktop-minimal ubuntu-session firefox curl ca-certificates linux-image-generic initramfs-tools && echo newclier > /etc/hostname && apt-get clean && rm -rf /var/lib/apt/lists/*"
          sudo umount /tmp/nr/dev
          sudo umount /tmp/nr/proc
          sudo umount /tmp/nr/sys

      - name: Prepare boot
        run: |
          sudo mkdir -p /tmp/nr/isolinux
          sudo cp /tmp/nr/boot/vmlinuz-* /tmp/nr/vmlinuz
          sudo cp /tmp/nr/boot/initrd.img-* /tmp/nr/initrd.img
          sudo cp /usr/lib/ISOLINUX/isolinux.bin /tmp/nr/isolinux/
          sudo cp /usr/lib/syslinux/modules/bios/*.c32 /tmp/nr/isolinux/
          printf 'UI menu.c32\nDEFAULT linux\nPROMPT 0\nTIMEOUT 300\nMENU TITLE Newclier Linux v2.0\nLABEL linux\n  MENU LABEL Newclier Linux v2\n  KERNEL /vmlinuz\n  INITRD /initrd.img\n  APPEND initrd=/initrd.img root=CDROM\n' | sudo tee /tmp/nr/isolinux/isolinux.cfg > /dev/null

      - name: Make ISO
        run: |
          sudo xorriso -as mkisofs -o /tmp/newclier-v2.iso -R -J -V NEWCLIER -b isolinux/isolinux.bin -c isolinux/boot.cat -no-emul-boot -boot-load-size 4 -boot-info-table /tmp/nr/

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: newclier-v2
          path: /tmp/newclier-v2.iso   
