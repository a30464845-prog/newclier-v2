name: Build Newclier v2
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y debootstrap xorriso syslinux-utils genisoimage

      - name: Build rootfs
        run: |
          sudo debootstrap noble /tmp/newclier-root http://archive.ubuntu.com/ubuntu
          sudo mount --bind /dev /tmp/newclier-root/dev
          sudo mount --bind /proc /tmp/newclier-root/proc
          sudo mount --bind /sys /tmp/newclier-root/sys
          sudo chroot /tmp/newclier-root /bin/bash -c "
            apt update
            apt install -y --no-install-recommends \
              gnome-desktop-environment gnome-session \
              firefox waydroid curl ca-certificates
            echo 'newclier' > /etc/hostname
            apt clean
          "
          sudo umount /tmp/newclier-root/dev
          sudo umount /tmp/newclier-root/proc
          sudo umount /tmp/newclier-root/sys

      - name: Make ISO
        run: |
          cd /tmp/newclier-root
          sudo xorriso -as mkisofs -o /tmp/newclier-v2.iso \
            -b isolinux/isolinux.bin \
            -c isolinux/boot.cat \
            -no-emul-boot \
            -boot-load-size 4 \
            -boot-info-table \
            -V "NEWCLIER" \
            .

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: newclier-v2
          path: /tmp/newclier-v2.iso   
