name: Build Newclier v2
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y debootstrap xorriso syslinux-utils

      - name: Build rootfs
        run: |
          sudo debootstrap noble /tmp/newclier-root http://archive.ubuntu.com/ubuntu
          sudo mount --bind /dev /tmp/newclier-root/dev
          sudo mount --bind /proc /tmp/newclier-root/proc
          sudo mount --bind /sys /tmp/newclier-root/sys
          sudo chroot /tmp/newclier-root /bin/bash -c "
            apt update
            apt install -y --no-install-recommends \
              gnome-desktop-environment gnome-session \
              firefox waydroid curl ca-certificates \
              syslinux linux-image-generic initramfs-tools
            echo 'newclier' > /etc/hostname
            apt clean
            apt autoremove -y
          "
          sudo umount /tmp/newclier-root/dev
          sudo umount /tmp/newclier-root/proc
          sudo umount /tmp/newclier-root/sys

      - name: Prepare boot files
        run: |
          sudo mkdir -p /tmp/newclier-root/isolinux
          sudo cp /tmp/newclier-root/boot/vmlinuz-* /tmp/newclier-root/vmlinuz
          sudo cp /tmp/newclier-root/boot/initrd.img-* /tmp/newclier-root/initrd.img
          sudo cp /usr/lib/syslinux/bios/isolinux.bin /tmp/newclier-root/isolinux/
          sudo tee /tmp/newclier-root/isolinux/isolinux.cfg > /dev/null << 'EOF'
UI menu.c32
DEFAULT linux
PROMPT 0
TIMEOUT 300
MENU TITLE Newclier Linux v2.0
LABEL linux
  MENU LABEL Newclier Linux
  KERNEL /vmlinuz
  INITRD /initrd.img
  APPEND initrd=/initrd.img root=/dev/sda auto
EOF

      - name: Make ISO
        run: |
          sudo xorriso -as mkisofs -o /tmp/newclier-v2.iso \
            -R -J -V "NEWCLIER" \
            -b isolinux/isolinux.bin \
            -c isolinux/boot.cat \
            -no-emul-boot \
            -boot-load-size 4 \
            -boot-info-table \
            -o "Newclier Linux v2" \
            /tmp/newclier-root/

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: newclier-v2
          path: /tmp/newclier-v2.iso   
